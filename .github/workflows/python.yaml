name: Python packages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.package.directory }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
        package:
          - directory: ndr-contract
            distribution: sunbeam-ndr-contract
    env:
      PACKAGE_NAME: ${{ matrix.package.distribution }}
      PACKAGE_DIR: packages/${{ matrix.package.directory }}
      DIST_DIR: dist/${{ matrix.package.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.18"
          python-version: ${{ matrix.python }}

      - name: Check the lockfile and source
        run: |
          uv lock --check
          uv sync --locked --package "$PACKAGE_NAME" --only-dev
          .venv/bin/ruff format --check "$PACKAGE_DIR"
          .venv/bin/ruff check "$PACKAGE_DIR"
          .venv/bin/mypy "$PACKAGE_DIR/src"

      - name: Build and test the package
        run: |
          uv build --package "$PACKAGE_NAME" --no-sources --out-dir "$DIST_DIR"
          uv pip install --python .venv/bin/python --no-deps "$DIST_DIR"/*.whl
          .venv/bin/python -m pytest --import-mode=importlib "$PACKAGE_DIR/tests"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.package.distribution }}-python-${{ matrix.python }}
          path: ${{ env.DIST_DIR }}/
          if-no-files-found: error
